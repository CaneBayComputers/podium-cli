{% if page.title and page.url contains '/guide/' %}
<!-- TechArticle is schema.org's type for technical/how-to documentation, which
     is what these pages are. Each one points back at the WebSite, the software
     it documents, and the publisher declared on the landing page, so the whole
     site resolves as one graph rather than a set of unrelated pages.
     No dates are emitted: GitHub Pages cannot run jekyll-last-modified-at, and
     a made-up date is worse than none. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "TechArticle",
      "@id": "{{ page.url | absolute_url }}#article",
      "url": "{{ page.url | absolute_url }}",
      "name": {{ page.title | jsonify }},
      "headline": {{ page.title | jsonify }},
      "inLanguage": "en",
      "isPartOf": { "@id": "https://zeltro.build/#website" },
      "about": { "@id": "https://zeltro.build/#software" },
      "author": { "@id": "https://zeltro.build/#org" },
      "publisher": { "@id": "https://zeltro.build/#org" },
      "license": "https://github.com/CaneBayComputers/zeltro-cli/blob/master/LICENSE",
      "isAccessibleForFree": true
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ page.url | absolute_url }}#breadcrumb",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://zeltro.build/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Documentation",
          "item": "https://zeltro.build/guide/"
        }{% unless page.url == '/guide/' %},
        {
          "@type": "ListItem",
          "position": 3,
          "name": {{ page.title | jsonify }},
          "item": "{{ page.url | absolute_url }}"
        }{% endunless %}
      ]
    }
  ]
}
</script>
{% endif %}
