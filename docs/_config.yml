title: Podium CLI
description: Pre-plumbed PHP, Python and Node environments so your AI agent can skip the setup and get straight to building.
remote_theme: just-the-docs/just-the-docs

# Served from the apex of podiumcli.com, so there is no project sub-path.
# Leaving baseurl as /podium-cli sends every asset to
# podiumcli.com/podium-cli/assets/... which 404s and the site renders unstyled.
url: https://podiumcli.com
baseurl: ""

# Navigation / search
search_enabled: true
search:
  heading_level: 2
  previews: 2
heading_anchors: true

# Pretty URLs: /guide/installation/ instead of /guide/installation.html.
# Without this Jekyll emits .html and every in-page link 404s.
permalink: pretty

aux_links:
  "GitHub":
    - "https://github.com/CaneBayComputers/podium-cli"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Podium CLI — open source. <a href="https://github.com/CaneBayComputers/podium-cli">Source on GitHub</a>.'

color_scheme: dark

plugins:
  - jekyll-remote-theme

exclude:
  - Gemfile
  - Gemfile.lock
